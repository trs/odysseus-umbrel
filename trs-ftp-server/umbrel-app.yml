manifestVersion: 1
id: trs-ftp-server
category: Files
name: FTP Server
version: "1.0"
tagline: Simple, lightweight FTP server
icon: https://raw.githubusercontent.com/trs/trs-umbrel/main/trs-ftp-server/icon.svg
description: >-
  A simple, lightweight FTP server for your Umbrel. Connect any FTP client
  to transfer files to and from your device.

  Uses passive mode on ports 40000-40009 for compatibility with most
  FTP clients behind NAT or firewalls.
developer: garethflowers
website: https://github.com/garethflowers/docker-ftp-server
repo: https://github.com/garethflowers/docker-ftp-server
support: https://github.com/garethflowers/docker-ftp-server/issues
port: 80
dependencies: []
gallery: []
path: ""
defaultUsername: admin
defaultPassword: ""
deterministicPassword: true
