version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: odysseus-app_web_1
      APP_PORT: 7000

  web:
    build:
      context: https://github.com/pewdiepie-archdaemon/odysseus.git#main
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
      - ${APP_DATA_DIR}/logs:/app/logs
      - ${APP_DATA_DIR}/data/ssh:/app/.ssh
      - ${APP_DATA_DIR}/data/huggingface:/app/.cache/huggingface
      - ${APP_DATA_DIR}/data/local:/app/.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LLM_HOST: localhost
      LLM_HOSTS: ""
      OPENAI_API_KEY: ""
      OLLAMA_BASE_URL: ""
      SEARXNG_INSTANCE: http://searxng:8080
      CHROMADB_HOST: chromadb
      CHROMADB_PORT: "8000"
      DATABASE_URL: sqlite:////app/data/app.db
      AUTH_ENABLED: "true"
      LOCALHOST_BYPASS: "false"
      ODYSSEUS_ADMIN_USER: admin
      ODYSSEUS_ADMIN_PASSWORD: ${APP_PASSWORD}
      ALLOWED_ORIGINS: "*"
      SECURE_COOKIES: "false"
      FASTEMBED_MODEL: sentence-transformers/all-MiniLM-L6-v2
      CLEANUP_INTERVAL_HOURS: "24"
      ODYSSEUS_INPROCESS_POLLERS: "1"
      ODYSSEUS_INPROCESS_TASKS: "1"
      ODYSSEUS_SCRIPT_HOST: localhost
      APP_BIND: "0.0.0.0"
      APP_PORT: "7000"
      PUID: "1000"
      PGID: "1000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:7000/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 300s
    depends_on:
      searxng:
        condition: service_healthy
      chromadb:
        condition: service_started

  chromadb:
    image: docker.io/chromadb/chroma:latest
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/chromadb:/chroma/chroma
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"

  searxng:
    image: docker.io/searxng/searxng:2026.5.31-7159b8aed
    restart: on-failure
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /etc/searxng
        if [ ! -s /etc/searxng/settings.yml ] || grep -q '__SEARXNG_SECRET__' /etc/searxng/settings.yml; then
          secret="$$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
          printf 'use_default_settings: true\nserver:\n  secret_key: "%s"\nsearch:\n  formats:\n    - html\n    - json\n' "$$secret" > /etc/searxng/settings.yml
        fi
        exec /usr/local/searxng/entrypoint.sh
    volumes:
      - ${APP_DATA_DIR}/searxng:/etc/searxng
    environment:
      SEARXNG_BASE_URL: http://localhost/
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8080/'', timeout=5).read(1)"',
        ]
      interval: 5s
      timeout: 6s
      retries: 20
      start_period: 10s

  ntfy:
    image: docker.io/binwiederhier/ntfy
    command: serve
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/ntfy:/var/cache/ntfy
    environment:
      NTFY_BASE_URL: http://localhost/
